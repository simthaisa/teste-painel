<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Teste de painel · a.estrategista</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Poppins,system-ui,sans-serif;background:#FAF6F0;color:#1f2a24;font-variant-numeric:lining-nums}
.aviso{background:#9BFF9B;color:#0E4961;text-align:center;font-weight:600;font-size:14px;padding:10px 16px}
.aviso:empty{display:none}
.capa{position:relative;min-height:78vh;display:flex;align-items:flex-end;color:#fff;background:#3d4a3d center/cover no-repeat}
.capa::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
.capa .in{position:relative;z-index:1;max-width:1080px;width:100%;margin:0 auto;padding:48px 20px}
.et{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;opacity:.9}
h1{font-size:clamp(36px,7vw,72px);line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:10px 0 14px;max-width:14ch}
.sub{font-size:18px;max-width:46ch;opacity:.95}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-block;background:#fff;color:#1f2a24;text-decoration:none;font-weight:600;padding:13px 22px;border-radius:999px}
.btn.v{background:#9BFF9B;color:#0E4961}
.preco{margin-top:16px;font-weight:600}
.casas{max-width:1080px;margin:0 auto;padding:56px 20px;display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.casa{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 14px 34px rgba(14,73,97,.08)}
.casa img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.casa div{padding:18px 20px 22px}
.casa h2{font-size:22px;font-weight:800}
.casa p{margin:6px 0 10px;color:#4b5a52}
.casa b{color:#0E4961}
footer{text-align:center;padding:30px 20px 50px;font-size:13px;color:#6b776f}
</style>
</head>
<body>
<div class="aviso" id="aviso"></div>
<header class="capa" id="capa"><div class="in">
  <div class="et" id="etiqueta"></div>
  <h1 id="titulo"></h1>
  <p class="sub" id="subtitulo"></p>
  <p class="preco" id="preco"></p>
  <div class="btns"><a class="btn v" id="wa" href="#">Reservar pelo WhatsApp</a><a class="btn" id="tel" href="#"></a></div>
</div></header>
<main class="casas" id="casas"></main>
<footer>Site de teste do painel de edição · a.estrategista</footer>
<script>
// Lê o conteúdo editado no painel (content/site.json) e monta a página.
function rel(p){return String(p||'').replace(/^\/+/,'');}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
fetch('content/site.json?v='+Date.now()).then(function(r){return r.json();}).then(function(d){
  document.title=d.nome||document.title;
  document.getElementById('aviso').textContent=d.aviso||'';
  document.getElementById('etiqueta').textContent=d.etiqueta||'';
  document.getElementById('titulo').textContent=d.titulo||'';
  document.getElementById('subtitulo').textContent=d.subtitulo||'';
  document.getElementById('preco').textContent=d.preco_desde||'';
  if(d.foto_capa)document.getElementById('capa').style.backgroundImage='url("'+rel(d.foto_capa)+'")';
  var wa=document.getElementById('wa');wa.href='https://wa.me/'+String(d.whatsapp||'').replace(/\D/g,'');
  var tel=document.getElementById('tel');tel.textContent=d.telefone||'';tel.href='tel:'+String(d.telefone||'').replace(/\s/g,'');
  document.getElementById('casas').innerHTML=(d.casas||[]).map(function(c){
    return '<article class="casa"><img src="'+esc(rel(c.foto))+'" alt="'+esc(c.nome)+'"><div><h2>'+esc(c.nome)+'</h2><p>'+esc(c.descricao)+'</p><b>'+esc(c.preco)+'</b></div></article>';
  }).join('');
});
</script>
</body>
</html>
